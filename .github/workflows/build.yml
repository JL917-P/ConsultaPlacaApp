  - name: Build APK
    shell: bash
    env:
          ANDROID_HOME: ${{ github.workspace }}/android-sdk
    run: |
          # === Variables del SDK ===
          export ANDROID_HOME=$HOME/android-sdk
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          export ANDROIDSDK=$ANDROID_HOME
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/build-tools/33.0.2:$PATH

          echo "=== Vinculando SDK externo a ruta esperada por Buildozer ==="
          mkdir -p $HOME/.buildozer/android/platform/
          ln -sf $ANDROID_HOME $HOME/.buildozer/android/platform/android-sdk

          echo "=== Compatibilidad con estructura antigua (tools/bin) ==="
          mkdir -p $HOME/.buildozer/android/platform/android-sdk/tools/bin
          ln -sf $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager $HOME/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager

          echo "=== Verificando sdkmanager y aidl ==="
          which sdkmanager || echo "sdkmanager no encontrado"
          which aidl || echo "aidl no encontrado"
          sdkmanager --version || true

          echo "=== Aceptando licencias del SDK ==="
          yes | sdkmanager --licenses --sdk_root=$ANDROID_HOME || true

          echo "=== Instalando herramientas requeridas ==="
          sdkmanager --sdk_root=$ANDROID_HOME "platform-tools" "platforms;android-33" "build-tools;33.0.2" || true

          echo "=== Forzando Build Tools visibles a Buildozer ==="
          mkdir -p $HOME/.buildozer/android/platform/android-sdk/build-tools/33.0.2/
          ln -sf $ANDROID_HOME/build-tools/33.0.2/aidl $HOME/.buildozer/android/platform/android-sdk/build-tools/33.0.2/aidl
          ln -sf $ANDROID_HOME/build-tools/33.0.2/lib $HOME/.buildozer/android/platform/android-sdk/build-tools/33.0.2/lib

          echo "=== Iniciando compilación ==="
          buildozer android debug

      - name: Install Android SDK manually
        shell: bash
        run: |
          mkdir -p $HOME/android-sdk/cmdline-tools
          cd $HOME/android-sdk/cmdline-tools
          wget https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O tools.zip
          unzip tools.zip
          mv cmdline-tools latest
          export ANDROID_HOME=$HOME/android-sdk
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH
          yes | sdkmanager --sdk_root=$ANDROID_HOME --licenses || true
          sdkmanager --sdk_root=$ANDROID_HOME "platform-tools" "platforms;android-33" "build-tools;33.0.2" || true

      - name: Build APK
        shell: bash
        env:
          ANDROID_HOME: ${{ github.workspace }}/android-sdk
        run: |
          # === Configurar rutas del SDK externo ===
          export ANDROID_HOME=$HOME/android-sdk
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/build-tools/33.0.2:$PATH

          echo "=== Vinculando SDK externo con Buildozer ==="
          mkdir -p $HOME/.buildozer/android/platform/android-sdk/build-tools/33.0.2/
          ln -sf $ANDROID_HOME/build-tools/33.0.2/aidl $HOME/.buildozer/android/platform/android-sdk/build-tools/33.0.2/aidl
          ln -sf $ANDROID_HOME/build-tools/33.0.2/lib $HOME/.buildozer/android/platform/android-sdk/build-tools/33.0.2/lib

          # === Crear compatibilidad con versiones antiguas ===
          mkdir -p $HOME/.buildozer/android/platform/android-sdk/tools/bin
          ln -sf $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager $HOME/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager

          echo "=== Verificando AIDL y SDKMANAGER ==="
          which aidl || echo "aidl no encontrado"
          which sdkmanager || echo "sdkmanager no encontrado"
          sdkmanager --version || true

          echo "=== Iniciando compilación con Buildozer ==="
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ConsultaPlacaApp-APK
          path: bin/*.apk
