name: Buildozer APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # ✅ Este paso instala Git, Java, y las dependencias correctamente
      - name: Install dependencies
        shell: bash
        run: |
          echo "=== Installing base packages ==="
          sudo apt-get update -y
          sudo apt-get install -y git zip unzip wget openjdk-17-jdk python3-dev libffi-dev libssl-dev

          echo "=== Upgrading pip & installing buildozer ==="
          pip install --upgrade pip
          pip install buildozer cython

      - name: Install Android SDK manually
        shell: bash
        run: |
          mkdir -p $HOME/android-sdk/cmdline-tools
          cd $HOME/android-sdk/cmdline-tools
          wget https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O tools.zip
          unzip tools.zip
          mv cmdline-tools latest
          export ANDROID_HOME=$HOME/android-sdk
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH
          yes | sdkmanager --sdk_root=$ANDROID_HOME --licenses
          sdkmanager --sdk_root=$ANDROID_HOME "platform-tools" "platforms;android-33" "build-tools;33.0.2"

      - name: Build APK
        shell: bash
        env:
          ANDROID_HOME: ${{ github.workspace }}/android-sdk
        run: |
          export ANDROID_HOME=$HOME/android-sdk
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/build-tools/33.0.2:$PATH
          echo "=== Checking Git installation ==="
          git --version || (echo "Git is still missing" && exit 1)
          echo "=== Starting Buildozer ==="
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ConsultaPlacaApp-APK
          path: bin/*.apk
