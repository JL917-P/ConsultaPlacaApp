name: Buildozer APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        shell: bash
        run: |
          sudo apt-get update -y
          sudo apt-get install -y git zip unzip wget openjdk-17-jdk python3-dev libffi-dev libssl-dev
          pip install --upgrade pip
          pip install buildozer cython

      - name: Install Android SDK and accept licenses
        shell: bash
        run: |
          mkdir -p $HOME/android-sdk/cmdline-tools
          cd $HOME/android-sdk/cmdline-tools
          wget https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O tools.zip
          unzip tools.zip
          mv cmdline-tools latest
          export ANDROID_HOME=$HOME/android-sdk
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH
          yes | sdkmanager --sdk_root=$ANDROID_HOME --licenses || true
          sdkmanager --sdk_root=$ANDROID_HOME "platform-tools" "platforms;android-33" "build-tools;33.0.2" || true

      - name: Build APK
        shell: bash
        env:
          ANDROID_HOME: ${{ github.workspace }}/android-sdk
        run: |
          echo "=== CONFIGURANDO ENTORNO ANDROID ==="
          export ANDROID_HOME=$HOME/android-sdk
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          export ANDROIDSDK=$ANDROID_HOME
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/build-tools/33.0.2:$PATH

          echo "=== CREANDO RUTAS ESPERADAS POR BUILDOZER ==="
          mkdir -p $HOME/.buildozer/android/platform/android-sdk/tools/bin
          mkdir -p $HOME/.buildozer/android/platform/android-sdk/build-tools/33.0.2/

          echo "=== ENLAZANDO BINARIOS ==="
          ln -sf $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager $HOME/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager
          ln -sf $ANDROID_HOME/build-tools/33.0.2/aidl $HOME/.buildozer/android/platform/android-sdk/build-tools/33.0.2/aidl
          ln -sf $ANDROID_HOME/build-tools/33.0.2/lib $HOME/.buildozer/android/platform/android-sdk/build-tools/33.0.2/lib

          echo "=== VERIFICANDO INSTALACIONES ==="
          which sdkmanager || echo "sdkmanager no encontrado"
          which aidl || echo "aidl no encontrado"
          sdkmanager --version || true

          echo "=== ACEPTANDO LICENCIAS DEL SDK ==="
          yes | sdkmanager --licenses --sdk_root=$ANDROID_HOME || true

          echo "=== INICIANDO COMPILACIÓN DE BUILDOZER ==="
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ConsultaPlacaApp-APK
          path: bin/*.apk
