name: Buildozer APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        shell: bash
        run: |
          sudo apt-get update -y
          sudo apt-get install -y git zip unzip wget openjdk-17-jdk python3-dev libffi-dev libssl-dev
          pip install --upgrade pip
          pip install buildozer cython

      - name: Install Android SDK manually
        shell: bash
        run: |
          echo "=== Instalando Android SDK moderno ==="
          mkdir -p $HOME/android-sdk/cmdline-tools
          cd $HOME/android-sdk/cmdline-tools
          wget https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O tools.zip
          unzip tools.zip
          mv cmdline-tools latest
          export ANDROID_HOME=$HOME/android-sdk
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH
          yes | sdkmanager --licenses || true
          sdkmanager --sdk_root=$ANDROID_HOME "platform-tools" "platforms;android-33" "build-tools;33.0.2" || true

      - name: Patch Buildozer SDK paths
        shell: bash
        run: |
          echo "=== Corrigiendo rutas para compatibilidad con Buildozer ==="
          export ANDROID_HOME=$HOME/android-sdk
          mkdir -p $HOME/.buildozer/android/platform/android-sdk/tools/bin
          mkdir -p $HOME/.buildozer/android/platform/android-sdk/build-tools/33.0.2

          # Crear enlaces simbólicos hacia los binarios reales
          ln -sf $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager $HOME/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager
          ln -sf $ANDROID_HOME/build-tools/33.0.2/aidl $HOME/.buildozer/android/platform/android-sdk/build-tools/33.0.2/aidl
          ln -sf $ANDROID_HOME/build-tools/33.0.2/lib $HOME/.buildozer/android/platform/android-sdk/build-tools/33.0.2/lib

          echo "=== Verificación ==="
          ls -la $HOME/.buildozer/android/platform/android-sdk/tools/bin/
          sdkmanager --version || echo "sdkmanager no disponible"

      - name: Build APK
        shell: bash
        run: |
          echo "=== Compilando APK con Buildozer ==="
          export ANDROID_HOME=$HOME/android-sdk
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/build-tools/33.0.2:$PATH
          yes | sdkmanager --licenses --sdk_root=$ANDROID_HOME || true
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ConsultaPlacaApp-APK
          path: bin/*.apk
