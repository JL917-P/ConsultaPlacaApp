<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Consulta Placa Vehicular</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="camera.js"></script>
  <script defer src="main.js"></script>
</head>

<body>
  <header>
    <h1>Consulta Placa Vehicular</h1>
  </header>

  <main>
    <p>Escribe una placa o usa la cámara trasera para capturarla:</p>

    <!-- Campo de texto para ingresar la placa -->
    <input type="text" id="placaInput" placeholder="Ejemplo: W4U807">

    <!-- Botones de acción -->
    <button id="buscarBtn">🔍 Consultar</button>
    <div class="buttons">
      <button id="captureBtn">📸 Capturar</button>
      <button id="closeBtn" class="cancel">❌ Cerrar</button>
    </div>

    <!-- Resultado dentro de la app -->
    <section id="resultado" class="card" hidden>
      <h2>DATOS DEL VEHÍCULO</h2>
      <div id="vehiculoDatos"></div>
    </section>

    <!-- 🔹 Botón para abrir el portal SUNARP -->
    <section id="consultaExterna" class="card">
      <h2>Consulta Vehicular SUNARP</h2>
      <p>Puedes abrir el portal oficial de SUNARP para consultar la placa con su código CAPTCHA.</p>
      <button class="sunarpBtn" onclick="window.open('https://www.sunarp.gob.pe/ConsultaVehicular', '_blank')">
        🌐 Abrir portal oficial SUNARP
      </button>
    </section>
  </main>

  <footer>© 2025 ConsultaPlacaApp</footer>
</body>
</html>
